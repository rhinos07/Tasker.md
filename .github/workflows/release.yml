name: Release

# Ein Tag wie v0.2.0 baut die Installer für Windows, macOS und Arch Linux (z. B. Omarchy) und legt sie als Release-Entwurf an.
# Veröffentlicht wird erst, wenn der Entwurf auf GitHub von Hand freigegeben wird.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Versionsnummern passen zum Tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/version.mjs check "${GITHUB_REF_NAME}"
      - name: Eigener Datenschutz-Check
        run: node scripts/check-private.mjs --all

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Tasker.md __VERSION__"
          releaseBody: |
            Installer für Windows (.msi oder .exe), macOS (.dmg, Apple Silicon und Intel) und Arch Linux / Omarchy (.pkg.tar.zst).

            Die Installer sind nicht signiert:
            - **Windows:** SmartScreen warnt beim ersten Start → „Weitere Informationen“ → „Trotzdem ausführen“.
            - **macOS:** Nach dem Kopieren nach „Programme“ einmal im Terminal `xattr -cr /Applications/Tasker.md.app` ausführen, sonst meldet macOS die App als beschädigt.
            - **Arch Linux / Omarchy:** `sudo pacman -U tasker-md-*.pkg.tar.zst`

            Einrichtung: siehe README.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
      # Manuell gestartet (ohne Tag): Installer nur als Artefakt des Laufs ablegen
      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag'
        with:
          name: installer-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # Arch-Paket (z. B. für Omarchy), gebaut gegen die aktuellen Arch-Bibliotheken
  arch:
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Pakete installieren
        run: pacman -Syu --noconfirm --needed git rust nodejs npm webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg dbus hicolor-icon-theme
      - uses: actions/checkout@v7
      - name: makepkg
        # makepkg läuft nicht als root
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging/arch
          su builder -c "makepkg --noconfirm"
      - uses: actions/upload-artifact@v7
        with:
          name: installer-arch
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  # Arch-Paket an den Release-Entwurf hängen, den tauri-action im Job build anlegt
  arch-release:
    needs: [build, arch]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: installer-arch
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" *.pkg.tar.zst --clobber --repo "${GITHUB_REPOSITORY}"
